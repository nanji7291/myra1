name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find Project and Setup Gradle
        run: |
          # Dhoondho ki build.gradle / build.gradle.kts kahan hai
          BUILD_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: Repository me koi build.gradle file nahi mili!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Project found at: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # Agar gradlew nahi hai toh Gradle install karke wrapper generate karega
          if [ ! -f "gradlew" ]; then
            echo "gradlew missing tha, generate kiya ja raha hai..."
            sudo apt-get update && sudo apt-get install -y gradle
            gradle wrapper
          fi

          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: '**/build/outputs/apk/debug/*.apk'
