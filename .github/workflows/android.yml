name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Isse aap Actions tab se manually bhi trigger kar sakte hain

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository checkout karein
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Node.js setup
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # 3. Java Development Kit (JDK 17) setup
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Android SDK setup
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Dependencies install karein (agar package.json ho)
      - name: Install Node Dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          fi

      # 6. Gradle Executable Permissions dein
      - name: Make Gradlew Executable
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          elif [ -f gradlew ]; then
            chmod +x gradlew
          fi

      # 7. APK Build Karein
      - name: Build Debug APK
        run: |
          if [ -d android ]; then
            cd android
            ./gradlew assembleDebug --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      # 8. Generated APK Upload karein
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
