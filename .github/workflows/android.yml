name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Unzip Source Code
        run: |
          echo "Unzipping project file..."
          unzip -o Laprri.ai-assistant.zip -d extracted_project

      - name: Build Debug APK
        run: |
          SETTINGS_FILE=$(find extracted_project -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
          
          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          else
            BUILD_FILE=$(find extracted_project -name "build.gradle" -o -name "build.gradle.kts" | sort | head -n 1)
            PROJECT_DIR=$(dirname "$BUILD_FILE")
          fi

          echo "Root Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # Gradle 8.4 wrapper setup
          gradle wrapper --gradle-version 8.4

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.unsafe.isolated-projects=false

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: '**/build/outputs/apk/debug/*.apk'
