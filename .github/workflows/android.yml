name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip Source Code
        run: |
          echo "Unzipping project file..."
          unzip -o Laprri.ai-assistant.zip -d extracted_project

      - name: Setup Gradle and Build APK
        run: |
          # Extracted folder ke andar build.gradle dhoondho
          BUILD_FILE=$(find extracted_project -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: Zip file ke andar build.gradle nahi mila!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Project directory found: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # Agar gradlew missing hai toh wrapper generate karega
          if [ ! -f "gradlew" ]; then
            echo "gradlew generating..."
            sudo apt-get update && sudo apt-get install -y gradle
            gradle wrapper
          fi

          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: '**/build/outputs/apk/debug/*.apk'
